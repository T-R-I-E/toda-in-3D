<!doctype html>
<html lang="en" class="theme-dark">
<head>
<meta charset="utf-8" />
<title>TODA in 3-D!</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />

<!-- avoid FOUC: set theme class before stylesheet applies -->
<script>
  (function () {
    try {
      const t = localStorage.getItem('toda3d.theme');
      const cls = 'theme-' + (t === 'light' ? 'light' : 'dark');
      document.documentElement.classList.remove('theme-dark', 'theme-light');
      document.documentElement.classList.add(cls);
    } catch (e) {}
  })();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=DM+Serif+Display:ital@0;1&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  /* ---------- theme tokens ---------- */
  html.theme-dark {
    --bg:        #0f1220;
    --bg-elev1:  #161a2c;
    --bg-elev2:  #1c2138;
    --bg-input:  #0b0e1a;
    --line:      rgba(255,255,255,0.07);
    --line-2:    rgba(255,255,255,0.13);
    --ink:       #e7e9f4;
    --ink-mute:  #9aa0c0;
    --ink-dim:   #6a708f;
    --kbd-bg:    rgba(255,255,255,0.06);
    --kbd-ink:   #c7cbe4;
  }
  html.theme-light {
    --bg:        #f4f4ee;
    --bg-elev1:  #ffffff;
    --bg-elev2:  #fbfbf6;
    --bg-input:  #ffffff;
    --line:      rgba(20,20,30,0.08);
    --line-2:    rgba(20,20,30,0.16);
    --ink:       #1c1e2a;
    --ink-mute:  #5e6378;
    --ink-dim:   #8a8fa3;
    --kbd-bg:    rgba(20,20,30,0.06);
    --kbd-ink:   #3a3e52;
  }
  :root {
    --accent:    #8b8cff;
    --accent-ink:#0d0f1c;
    --accent-hi: #a8a9ff;

    /* Edge palette — kept on the rigging-workshop hues since these tie to
       data semantics and to the 3MF/SCAD export colors. */
    --rig-prev:  #999999;
    --rig-teth:  #ff99ff;
    --rig-lead:  #3dff33;
    --rig-meet:  #8866ff;
    --rig-post:  #ffae3c;

    --ana-red:  #ff3b3b;
    --ana-cyan: #3bd1d6;

    --radius:    8px;
    --pad-y:     9px;
    --pad-x:     13px;
    --font-sans: 'Inter Tight', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  html.theme-light {
    --ana-red:  #ee2c2c;
    --ana-cyan: #2b9ea3;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-sans);
    font-size: 13px;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.005em;
    overflow: hidden;
  }
  .mono { font-family: var(--font-mono); }

  /* ---------- layout ---------- */
  .app {
    height: 100vh; width: 100vw;
    display: grid;
    grid-template-rows: 70px 1fr 36px 92px 32px;
    grid-template-columns: minmax(0, 1fr);
    overflow: hidden;
  }
  .app > * { min-width: 0; }

  /* ---------- topbar ---------- */
  .topbar {
    position: relative;
    display: flex; align-items: center; gap: 10px;
    padding: 0 14px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, color-mix(in oklab, var(--bg-elev1) 90%, white 0%), var(--bg-elev1));
    overflow-x: auto; overflow-y: hidden;
    scrollbar-width: none;
  }
  .topbar::-webkit-scrollbar { display: none; }
  .topbar::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(180deg, transparent 0 2px, rgba(255,255,255,0.018) 2px 3px);
    mix-blend-mode: overlay;
  }
  .topbar > * { position: relative; z-index: 1; }

  .brand { display: flex; align-items: center; gap: 10px; white-space: nowrap; flex-shrink: 0; padding-right: 6px; }
  .brand-mark { display: inline-flex; color: var(--ink); }
  .brand-mark svg { display: block; overflow: visible; }
  .trie-anaglyph { mix-blend-mode: screen; opacity: 0.85; }
  .trie-anaglyph .tri-shadow { fill: currentColor; opacity: 0.18; }
  .trie-ana-red  { color: var(--ana-red);  transform: translate(-2.2px, 0); }
  .trie-ana-cyan { color: var(--ana-cyan); transform: translate( 2.2px, 0); }
  .trie-main { color: var(--ink); }
  .trie-main .tri-shadow { fill: currentColor; opacity: 0.22; }
  html.theme-light .trie-anaglyph { mix-blend-mode: normal; opacity: 1; }
  html.theme-light .trie-anaglyph .tri-shadow { opacity: 0.25; }
  html.theme-light .trie-main .tri-shadow { opacity: 0.55; }

  .brand-trie {
    font-family: 'DM Serif Display', Georgia, serif;
    font-size: 34px; line-height: 1; letter-spacing: 0.005em;
    color: var(--ink);
    text-shadow:
      -2px 0 0 color-mix(in oklab, var(--ana-red)  85%, transparent),
       2px 0 0 color-mix(in oklab, var(--ana-cyan) 85%, transparent);
    padding: 0 4px 0 2px;
  }
  html.theme-light .brand-trie {
    text-shadow:
      -2px 0 0 color-mix(in oklab, var(--ana-red)  95%, transparent),
       2px 0 0 color-mix(in oklab, var(--ana-cyan) 95%, transparent);
  }
  .brand-presents {
    display: inline-flex; align-items: center; gap: 5px;
    font-family: 'DM Serif Display', Georgia, serif;
    font-style: italic; font-size: 13px;
    color: var(--ink-mute);
    letter-spacing: 0.04em; padding: 0 6px;
  }
  .sparkle { color: var(--rig-meet); animation: twinkle 2.2s ease-in-out infinite; }
  .sparkle.s2 { color: var(--rig-teth); animation-delay: 1.1s; }
  @keyframes twinkle {
    0%, 100% { transform: scale(1)   rotate(0deg);   opacity: 1; }
    50%      { transform: scale(0.5) rotate(45deg);  opacity: 0.35; }
  }

  .brand-toda { display: inline-flex; align-items: baseline; gap: 6px; line-height: 1; color: var(--ink); }
  .brand-toda-word, .brand-3d {
    font-family: 'Bungee', 'Inter Tight', sans-serif;
    font-weight: 400; letter-spacing: 0.01em;
    color: var(--ink);
    text-shadow:
      -2px 0 0 color-mix(in oklab, var(--ana-red)  92%, transparent),
       2px 0 0 color-mix(in oklab, var(--ana-cyan) 92%, transparent);
  }
  .brand-toda-word { font-size: 28px; }
  .brand-3d { font-size: 24px; }
  .brand-in {
    font-family: 'DM Serif Display', Georgia, serif;
    font-style: italic; font-weight: 400; font-size: 15px;
    color: var(--ink-mute); text-shadow: none;
  }
  .brand-bang {
    color: var(--accent); margin-left: 1px; font-size: 26px;
    text-shadow:
      -1.5px 0 0 color-mix(in oklab, var(--accent) 50%, var(--ana-red)),
       1.5px 0 0 color-mix(in oklab, var(--accent) 50%, var(--ana-cyan));
  }

  .divider-v { width: 1px; height: 22px; background: var(--line-2); margin: 0 4px; }
  .tool-group { display: flex; gap: 4px; }
  .spacer { flex: 1; }
  .io-group { display: flex; gap: 4px; }

  /* ---------- buttons ---------- */
  .btn {
    appearance: none; font-family: inherit; font-size: 12.5px; font-weight: 500; line-height: 1;
    white-space: nowrap; color: var(--ink);
    background: var(--bg-elev2); border: 1px solid var(--line);
    padding: var(--pad-y) var(--pad-x); border-radius: var(--radius);
    display: inline-flex; align-items: center; gap: 6px;
    cursor: pointer;
    transition: background 120ms ease, border-color 120ms ease, transform 80ms ease, color 120ms ease;
    letter-spacing: -0.005em;
  }
  .btn:hover { background: color-mix(in oklab, var(--bg-elev2) 75%, white 6%); border-color: var(--line-2); }
  .btn:active { transform: translateY(0.5px); }
  .btn .btn-icon { color: var(--ink-mute); display: inline-flex; }
  .btn:hover .btn-icon { color: var(--ink); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .btn-ghost { background: transparent; border-color: transparent; color: var(--ink-mute); }
  .btn-ghost:hover { background: var(--bg-elev2); border-color: var(--line); color: var(--ink); }

  .btn-primary {
    background: var(--accent); color: var(--accent-ink);
    border-color: transparent;
    box-shadow: 0 0 0 1px color-mix(in oklab, var(--accent) 40%, transparent),
                0 1px 0 rgba(0,0,0,0.25) inset;
  }
  .btn-primary:hover { background: var(--accent-hi); }
  .btn-primary .btn-icon { color: var(--accent-ink); opacity: .9; }

  .btn-tone {
    background: color-mix(in oklab, var(--tone) 14%, var(--bg-elev2));
    border-color: color-mix(in oklab, var(--tone) 32%, var(--line));
    color: var(--ink);
  }
  .btn-tone .btn-icon { color: var(--tone); }
  .btn-tone:hover {
    background: color-mix(in oklab, var(--tone) 22%, var(--bg-elev2));
    border-color: color-mix(in oklab, var(--tone) 55%, var(--line-2));
  }
  .btn-tone-teth { --tone: var(--rig-teth); }
  .btn-tone-lead { --tone: var(--rig-lead); }
  .btn-tone-meet { --tone: var(--rig-meet); }
  .btn-tone-post { --tone: var(--rig-post); }

  .pill-toggle { display: inline-flex; align-items: center; gap: 6px; font-weight: 500; }
  .pill-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--ink-dim);
    transition: background 150ms ease, box-shadow 150ms ease;
  }
  .pill-toggle.on .pill-dot {
    background: var(--rig-lead);
    box-shadow: 0 0 6px color-mix(in oklab, var(--rig-lead) 70%, transparent);
  }

  .theme-toggle {
    appearance: none; background: var(--bg-elev2); border: 1px solid var(--line);
    border-radius: 999px; padding: 4px; cursor: pointer;
    display: inline-flex; align-items: center;
    transition: background 120ms ease, border-color 120ms ease;
    flex-shrink: 0;
  }
  .theme-toggle:hover { background: color-mix(in oklab, var(--bg-elev2) 70%, white 8%); border-color: var(--line-2); }
  .theme-toggle-track {
    display: inline-flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; border-radius: 50%; background: var(--bg);
    transition: transform 300ms cubic-bezier(.5,1.5,.5,1), color 200ms ease;
  }
  html.theme-light .theme-toggle-track { color: #f5b94e; }
  html.theme-dark  .theme-toggle-track { color: var(--accent); }
  .theme-toggle:hover .theme-toggle-track { transform: scale(1.08) rotate(8deg); }

  /* ---------- stage + panels ---------- */
  .stage { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); min-height: 0; }
  .panel {
    position: relative; display: flex; flex-direction: column;
    min-height: 0; min-width: 0;
    background: var(--bg);
    border-right: 1px solid var(--line);
  }
  .panel:last-child { border-right: none; }
  .panel-lens-red  { --lens: var(--ana-red);  --lens-soft: rgba(255, 59, 59, 0.18); }
  .panel-lens-blue { --lens: #3b8cff;          --lens-soft: rgba(59, 140, 255, 0.18); }

  .panel-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px;
    border-bottom: 1px solid var(--line);
    background: color-mix(in oklab, var(--bg-elev1) 50%, transparent);
  }
  .panel-eyebrow {
    font-family: var(--font-mono); font-size: 10.5px;
    text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--ink-dim);
  }
  .panel-meta { font-size: 11px; color: var(--ink-mute); white-space: nowrap; }

  .panel-body {
    flex: 1; min-height: 0;
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(ellipse at center, transparent 40%, var(--lens-soft) 100%),
      var(--bg);
  }

  .lens-tag {
    margin-left: 8px; font-family: var(--font-mono);
    font-size: 9.5px; letter-spacing: 0.1em;
    padding: 2px 6px; border-radius: 3px;
    background: color-mix(in oklab, var(--ink) 5%, transparent);
    border: 1px solid currentColor; text-transform: uppercase;
  }
  .lens-tag-red  { color: #ff7a7a; }
  .lens-tag-blue { color: #6fa4ff; }
  html.theme-light .lens-tag-red  { color: #c12626; }
  html.theme-light .lens-tag-blue { color: #2360c7; }

  .lens-frame {
    position: absolute; inset: 8px;
    pointer-events: none; border-radius: 14px;
    z-index: 3;
    box-shadow:
      0 0 0 1px rgba(0,0,0,0.55),
      inset 0 0 0 3px var(--lens),
      inset 0 0 0 4px rgba(0,0,0,0.45),
      0 0 24px color-mix(in oklab, var(--lens) 45%, transparent),
      inset 0 0 120px color-mix(in oklab, var(--lens) 16%, transparent);
    background:
      linear-gradient(180deg,
        color-mix(in oklab, var(--lens) 10%, transparent) 0%,
        transparent 18%, transparent 78%,
        color-mix(in oklab, var(--lens) 5%, transparent) 100%);
  }
  html.theme-light .lens-frame {
    box-shadow:
      0 0 0 1px rgba(0,0,0,0.18),
      inset 0 0 0 3px var(--lens),
      inset 0 0 0 4px rgba(0,0,0,0.12),
      0 0 18px color-mix(in oklab, var(--lens) 30%, transparent),
      inset 0 0 100px color-mix(in oklab, var(--lens) 10%, transparent);
  }

  .ph-halftone {
    position: absolute; inset: 0; pointer-events: none; z-index: 0;
    background-image: radial-gradient(color-mix(in oklab, var(--ink) 20%, transparent) 1px, transparent 1.6px);
    background-size: 14px 14px;
    opacity: 0.10;
    mask-image: radial-gradient(ellipse at center, black 30%, transparent 78%);
    -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 78%);
  }

  /* SVG editor + 3D canvas mount points */
  #editorSvg, #previewCanvas {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    display: block; z-index: 1;
  }
  #editorSvg { cursor: default; user-select: none; -webkit-user-select: none; }

  /* SVG editor visuals (theme-aware) */
  .twist { stroke: var(--ink); stroke-width: 1; cursor: pointer; }
  .twist.loose { fill: color-mix(in oklab, var(--ink) 18%, var(--bg)); }
  .twist.fast  { fill: var(--ink); stroke: var(--ink); }
  .twist:hover { stroke: var(--accent); stroke-width: 1.6; }
  .twist.selected { stroke: var(--accent); stroke-width: 2.4; }

  .line-rail { stroke: var(--line-2); stroke-width: 1; }
  .line-label {
    fill: var(--ink-dim); font-size: 11px;
    font-family: var(--font-mono);
    cursor: pointer; user-select: none;
  }
  .line-label:hover { fill: var(--ink-mute); }
  .line-label.selected { fill: var(--accent); }

  .edge { fill: none; stroke-width: 2; pointer-events: none; stroke-linecap: round; }
  .edge.prev { stroke: var(--rig-prev); stroke-width: 1.5; }
  .edge.teth { stroke: var(--rig-teth); }
  .edge.lead { stroke: var(--rig-lead); }
  .edge.meet { stroke: var(--rig-meet); }
  .edge.post { stroke: var(--rig-post); }

  .ghost-add {
    fill: color-mix(in oklab, var(--ink) 4%, transparent);
    stroke: var(--line-2); stroke-dasharray: 3 3;
    cursor: pointer;
  }
  .ghost-add:hover {
    fill: color-mix(in oklab, var(--accent) 14%, transparent);
    stroke: var(--accent);
  }
  .ghost-plus {
    fill: var(--ink-dim); font-size: 14px;
    pointer-events: none; text-anchor: middle; dominant-baseline: central;
    font-family: var(--font-mono);
  }

  /* ---------- help strip ---------- */
  .help {
    display: flex; align-items: center; gap: 10px;
    padding: 0 16px;
    font-size: 12px; color: var(--ink-mute);
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    background: color-mix(in oklab, var(--bg-elev1) 60%, transparent);
    overflow-x: auto; white-space: nowrap;
  }
  .help em { font-style: normal; color: var(--ink); font-weight: 500; }
  .help-verb { color: var(--ink); font-weight: 500; }
  .help-sep { color: var(--ink-dim); }
  .kbd {
    font-family: var(--font-mono); font-size: 10.5px; font-weight: 500;
    color: var(--kbd-ink); background: var(--kbd-bg);
    padding: 2px 6px; border-radius: 4px;
    border: 1px solid var(--line);
    box-shadow: 0 1px 0 var(--line) inset;
  }

  /* ---------- controls strip ---------- */
  .controls-wrap {
    position: relative;
    background: var(--bg-elev1);
    border-top: 1px solid var(--line);
    min-width: 0; overflow: hidden;
  }
  .controls {
    display: flex; align-items: stretch;
    padding: 12px 14px;
    overflow-x: auto;
    scrollbar-color: var(--accent) var(--bg-input);
    scrollbar-width: thin;
    height: 100%;
  }
  .controls::-webkit-scrollbar { height: 8px; }
  .controls::-webkit-scrollbar-track { background: var(--bg-input); border-top: 1px solid var(--line); }
  .controls::-webkit-scrollbar-thumb {
    background: linear-gradient(90deg, var(--ana-red), var(--ana-cyan));
    border-radius: 4px;
    border: 1px solid var(--bg-elev1);
  }
  .controls::-webkit-scrollbar-thumb:hover { filter: brightness(1.15); }

  .controls-fade {
    position: absolute; top: 0; right: 0; bottom: 8px;
    width: 60px; pointer-events: auto;
    background: linear-gradient(90deg, transparent, var(--bg-elev1) 70%);
    display: flex; align-items: center; justify-content: flex-end;
    padding-right: 8px; cursor: pointer;
    transition: opacity 200ms ease;
  }
  .controls-fade.hidden { opacity: 0; pointer-events: none; }
  .controls-chev {
    display: inline-flex; align-items: center; justify-content: center;
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--bg-elev2);
    border: 1px solid var(--line-2);
    color: var(--ink-mute);
    font-family: var(--font-mono); font-size: 13px;
    animation: chev-nudge 1.6s ease-in-out infinite;
  }
  @keyframes chev-nudge {
    0%, 100% { transform: translateX(0); }
    50%      { transform: translateX(3px); }
  }

  .control-group {
    display: flex; align-items: center; gap: 18px;
    padding: 0 18px; border-right: 1px dashed var(--line);
  }
  .control-group:first-child { padding-left: 4px; }
  .control-group:last-child  { border-right: none; }
  .group-label {
    font-family: var(--font-mono); font-size: 10px;
    text-transform: uppercase; letter-spacing: 0.12em;
    color: var(--ink-dim);
    white-space: nowrap; flex-shrink: 0;
  }
  .group-unit { opacity: 0.7; }

  .slider {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 12px; flex-shrink: 0;
  }
  .slider-label {
    color: var(--accent); font-size: 11.5px;
    min-width: 52px; text-align: right; opacity: 0.95;
  }
  .slider.tone-teth { --accent: var(--rig-teth); }
  .slider.tone-lead { --accent: var(--rig-lead); }
  .slider.tone-meet { --accent: var(--rig-meet); }
  .slider.tone-post { --accent: var(--rig-post); }
  .slider.tone-prev { --accent: var(--rig-prev); }

  .slider-track-wrap {
    position: relative; width: 96px; height: 18px;
    display: inline-flex; align-items: center;
  }
  .slider input[type=range] {
    appearance: none; -webkit-appearance: none;
    width: 100%; height: 4px; margin: 0;
    background: transparent;
  }
  .slider input[type=range]::-webkit-slider-runnable-track {
    height: 4px; border-radius: 2px;
    background: linear-gradient(90deg, var(--accent) 0 var(--pct, 50%), var(--bg-input) var(--pct, 50%) 100%);
    border: 1px solid var(--line);
  }
  .slider input[type=range]::-moz-range-track {
    height: 4px; border-radius: 2px;
    background: var(--bg-input); border: 1px solid var(--line);
  }
  .slider input[type=range]::-moz-range-progress {
    background: var(--accent); height: 4px; border-radius: 2px;
  }
  .slider input[type=range]::-webkit-slider-thumb {
    appearance: none; -webkit-appearance: none;
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--ink); border: 2px solid var(--bg-elev1);
    margin-top: -5px;
    box-shadow: 0 0 0 1px var(--line-2);
    cursor: grab;
  }
  .slider input[type=range]::-moz-range-thumb {
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--ink); border: 2px solid var(--bg-elev1);
    box-shadow: 0 0 0 1px var(--line-2);
    cursor: grab;
  }
  .slider-value {
    font-family: var(--font-mono); font-size: 11.5px;
    color: var(--ink); min-width: 36px; text-align: left;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- status bar ---------- */
  .statusbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 14px;
    font-size: 11px;
    border-top: 1px solid var(--line);
    background: var(--bg);
    color: var(--ink-mute);
  }
  .status-left { display: flex; align-items: center; gap: 10px; min-height: 0; overflow: hidden; }
  .status-chip {
    background: var(--bg-elev2);
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 2px 7px;
    border-radius: 4px;
    font-size: 10.5px;
    white-space: nowrap;
  }
  .status-piece { color: var(--ink-mute); font-size: 11px; }
  .status-piece b { color: var(--ink); font-weight: 500; }
  .status-dot { color: var(--ink-dim); }
  .status-sel { color: var(--accent); }

  .legend { display: flex; align-items: center; gap: 14px; }
  .swatch { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-mute); }
  .swatch-dot { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }

  button:focus-visible, input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg width="58" height="32" viewBox="-2 -2 154 92">
          <g class="trie-anaglyph trie-ana-cyan">
            <path class="tri-shadow" d="M 0 0 L 100 0 L 50 86.6 Z"></path>
            <path d="M 100 0 L 50 86.6 L 150 86.6 Z" fill="none" stroke="currentColor" stroke-width="2"></path>
            <path d="M 100 0 L 88.2 86.6" fill="none" stroke="currentColor" stroke-width="2"></path>
          </g>
          <g class="trie-anaglyph trie-ana-red">
            <path class="tri-shadow" d="M 0 0 L 100 0 L 50 86.6 Z"></path>
            <path d="M 100 0 L 50 86.6 L 150 86.6 Z" fill="none" stroke="currentColor" stroke-width="2"></path>
            <path d="M 100 0 L 88.2 86.6" fill="none" stroke="currentColor" stroke-width="2"></path>
          </g>
          <g class="trie-main">
            <path class="tri-shadow" d="M 0 0 L 100 0 L 50 86.6 Z"></path>
            <path d="M 100 0 L 50 86.6 L 150 86.6 Z" fill="none" stroke="currentColor" stroke-width="2"></path>
            <path d="M 100 0 L 88.2 86.6" fill="none" stroke="currentColor" stroke-width="2"></path>
          </g>
        </svg>
      </span>
      <span class="brand-trie">T.R.I.E.</span>
      <span class="brand-presents">
        <svg class="sparkle" viewBox="0 0 12 12" width="10" height="10" aria-hidden="true"><path d="M6 0 L7 5 L12 6 L7 7 L6 12 L5 7 L0 6 L5 5 Z" fill="currentColor"/></svg>
        <i>presents</i>
        <svg class="sparkle s2" viewBox="0 0 12 12" width="10" height="10" aria-hidden="true"><path d="M6 0 L7 5 L12 6 L7 7 L6 12 L5 7 L0 6 L5 5 Z" fill="currentColor"/></svg>
      </span>
      <span class="brand-toda">
        <span class="brand-toda-word">TODA</span>
        <span class="brand-in">in</span>
        <span class="brand-3d">3-D<span class="brand-bang">!</span></span>
      </span>
    </div>

    <div class="divider-v"></div>

    <div class="tool-group" role="group" aria-label="Create">
      <button class="btn btn-tone btn-tone-teth" id="btn-add-line" title="Add a new line (N)">
        <span class="btn-icon"><svg viewBox="0 0 14 14" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M7 2v10M2 7h10"/></svg></span>
        <span>Line</span>
      </button>
      <button class="btn btn-tone btn-tone-post" id="btn-add-twist" title="Add a twist (T)">
        <span class="btn-icon"><svg viewBox="0 0 14 14" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M3 3c2 3 6 3 8 0M3 11c2-3 6-3 8 0M3 7h8"/></svg></span>
        <span>Twist</span>
      </button>
    </div>

    <div class="tool-group" role="group" aria-label="Modify">
      <button class="btn btn-ghost" id="btn-toggle-fast" title="Toggle fast (F)">
        <span class="pill-toggle" id="fast-pill">
          <span class="pill-dot"></span>
          <span id="fast-label">Fast / Loose</span>
        </span>
      </button>
      <button class="btn btn-ghost" id="btn-remove" title="Remove (Del)">
        <span class="btn-icon"><svg viewBox="0 0 14 14" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M2.5 4h9M5.5 2.5h3M3.5 4l.7 8h5.6l.7-8M6 6.5v4M8 6.5v4"/></svg></span>
        <span>Remove</span>
      </button>
    </div>

    <div class="spacer"></div>

    <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme" title="Toggle dark/light">
      <span class="theme-toggle-track" id="theme-toggle-icon"></span>
    </button>

    <div class="io-group" role="group" aria-label="Import / export">
      <button class="btn btn-tone btn-tone-teth" id="btn-import">
        <span class="btn-icon"><svg viewBox="0 0 14 14" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 9V2M4 5l3-3 3 3M2.5 11.5h9"/></svg></span>
        <span>Import JSON</span>
      </button>
      <input type="file" id="file-input" accept=".json,application/json" hidden>
      <button class="btn btn-tone btn-tone-lead" id="btn-export-json">
        <span class="btn-icon"><svg viewBox="0 0 14 14" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 2v7M4 6l3 3 3-3M2.5 11.5h9"/></svg></span>
        <span>Export JSON</span>
      </button>
      <button class="btn btn-tone btn-tone-meet" id="btn-export-scad">
        <span class="btn-icon"><svg viewBox="0 0 14 14" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"><path d="M2 4l5-2.5L12 4v6L7 12.5 2 10z M2 4l5 2.5L12 4M7 6.5v6"/></svg></span>
        <span>Export .scad</span>
      </button>
      <button class="btn btn-primary" id="btn-export-3mf">
        <span class="btn-icon"><svg viewBox="0 0 14 14" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"><path d="M7 1.5l5 2.6v5.8L7 12.5 2 9.9V4.1z M2 4.1l5 2.6 5-2.6M7 6.7v5.8"/></svg></span>
        <span>Export .3mf</span>
      </button>
    </div>
  </header>

  <main class="stage">
    <section class="panel panel-lens-red" aria-label="Rig editor">
      <div class="panel-header">
        <span class="panel-eyebrow">Rig editor <span class="lens-tag lens-tag-red">L · left lens</span></span>
        <span class="panel-meta mono" id="panel-meta-editor">—</span>
      </div>
      <div class="panel-body">
        <div class="ph-halftone"></div>
        <svg id="editorSvg" xmlns="http://www.w3.org/2000/svg"></svg>
        <div class="lens-frame" aria-hidden="true"></div>
      </div>
    </section>

    <section class="panel panel-lens-blue" aria-label="3D preview">
      <div class="panel-header">
        <span class="panel-eyebrow">3D preview <span class="lens-tag lens-tag-blue">R · right lens</span></span>
        <span class="panel-meta mono">drag to orbit</span>
      </div>
      <div class="panel-body">
        <div class="ph-halftone"></div>
        <canvas id="previewCanvas"></canvas>
        <div class="lens-frame" aria-hidden="true"></div>
      </div>
    </section>
  </main>

  <div class="help">
    <span><span class="help-verb">click</span> a twist to select</span>
    <span class="help-sep">·</span>
    <span><kbd class="kbd">shift</kbd>-click a twist above to set <em>tether</em></span>
    <span class="help-sep">·</span>
    <span><kbd class="kbd">alt</kbd>-click to set <em>hoist</em></span>
    <span class="help-sep">·</span>
    <span><kbd class="kbd">F</kbd> toggle fast</span>
    <span class="help-sep">·</span>
    <span><kbd class="kbd">Del</kbd> remove</span>
  </div>

  <div class="controls-wrap">
    <div class="controls" id="params">
      <div class="control-group">
        <span class="group-label">Geometry <span class="group-unit">mm</span></span>
        <label class="slider tone-post">
          <span class="slider-label">plate</span>
          <span class="slider-track-wrap"><input type="range" data-p="plateThickness" min="0.5" max="6" step="0.1"></span>
          <span class="slider-value" data-v="plateThickness"></span>
        </label>
        <label class="slider tone-teth">
          <span class="slider-label">border h</span>
          <span class="slider-track-wrap"><input type="range" data-p="borderHeight" min="0" max="10" step="0.5"></span>
          <span class="slider-value" data-v="borderHeight"></span>
        </label>
        <label class="slider tone-meet">
          <span class="slider-label">border w</span>
          <span class="slider-track-wrap"><input type="range" data-p="borderWidth" min="0" max="8" step="0.5"></span>
          <span class="slider-value" data-v="borderWidth"></span>
        </label>
        <label class="slider tone-lead">
          <span class="slider-label">twist r</span>
          <span class="slider-track-wrap"><input type="range" data-p="twistRadius" min="1" max="10" step="0.2"></span>
          <span class="slider-value" data-v="twistRadius"></span>
        </label>
        <label class="slider tone-prev">
          <span class="slider-label">edge r</span>
          <span class="slider-track-wrap"><input type="range" data-p="edgeRadius" min="0.2" max="3" step="0.1"></span>
          <span class="slider-value" data-v="edgeRadius"></span>
        </label>
      </div>

      <div class="control-group">
        <span class="group-label">Layout</span>
        <label class="slider tone-lead">
          <span class="slider-label">twist gap</span>
          <span class="slider-track-wrap"><input type="range" data-p="twistSpacing" min="8" max="32" step="1"></span>
          <span class="slider-value" data-v="twistSpacing"></span>
        </label>
        <label class="slider tone-meet">
          <span class="slider-label">line gap</span>
          <span class="slider-track-wrap"><input type="range" data-p="lineSpacing" min="14" max="48" step="1"></span>
          <span class="slider-value" data-v="lineSpacing"></span>
        </label>
      </div>
    </div>
    <div class="controls-fade" id="controls-fade" title="scroll for more">
      <span class="controls-chev">›</span>
    </div>
  </div>

  <footer class="statusbar">
    <div class="status-left mono" id="status-left">
      <span class="status-chip">—</span>
    </div>
    <div class="legend">
      <span class="swatch"><span class="swatch-dot" style="background: var(--rig-prev)"></span>prev</span>
      <span class="swatch"><span class="swatch-dot" style="background: var(--rig-teth)"></span>teth</span>
      <span class="swatch"><span class="swatch-dot" style="background: var(--rig-lead)"></span>lead</span>
      <span class="swatch"><span class="swatch-dot" style="background: var(--rig-meet)"></span>meet</span>
      <span class="swatch"><span class="swatch-dot" style="background: var(--rig-post)"></span>post</span>
    </div>
  </footer>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
